name: Python unit tests
on:
  push:
    branches: [main, feature/avg-map-catalog-whitelist, feature/visibility-quotas, feature/smart-placement, feature/adaptive-visibility-field, feature/occluder-guided-sampling]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python source syntax
        run: python -m compileall -q .
      - name: Run all tests
        run: python -m unittest discover -v
      - name: Check region-renderer patch against pinned Dagor sources
        run: |
          python - <<'PY'
          import pathlib, subprocess, tempfile, urllib.request
          source = 'https://raw.githubusercontent.com/ElecTriKusX/DagorEngine/9639942de5a8e5b01d91977f60ed82cda22d5f41/'
          paths = [
            'prog/gameLibs/publicInclude/landMesh/lastClip.h',
            'prog/gameLibs/landMesh/lastClip.cpp',
            'prog/gameLibs/rendInst/rendInstGenCollision.cpp',
            'prog/tools/sceneTools/daEditorX/binSceneView/strmLevel.cpp',
          ]
          with tempfile.TemporaryDirectory() as temp:
              root = pathlib.Path(temp)
              for path in paths:
                  file = root / path
                  file.parent.mkdir(parents=True, exist_ok=True)
                  with urllib.request.urlopen(source + path, timeout=30) as response:
                      file.write_bytes(response.read())
              patch = pathlib.Path.cwd() / 'engine/patches/dagor-tank-map-render.patch'
              subprocess.run(['git', 'apply', '--check', str(patch)], cwd=root, check=True)
              subprocess.run(['git', 'apply', str(patch)], cwd=root, check=True)
              subprocess.run(['git', 'apply', '--reverse', '--check', str(patch)], cwd=root, check=True)
              print('ROI renderer patch applies and reverses cleanly.')
              from tools.ke_ri_trace_props import install_ri_trace_props
              ri_source = root / 'prog/gameLibs/rendInst/rendInstGenCollision.cpp'
              assert install_ri_trace_props(ri_source)
              once = ri_source.read_bytes()
              assert not install_ri_trace_props(ri_source)
              assert once == ri_source.read_bytes()
              print('RendInst trace guard applies to pinned Dagor and is idempotent.')
              from tools.ke_dagor_objects import upgrade_walk
              before = ri_source.read_text(encoding='utf-8')
              after = upgrade_walk(before)
              assert before != after
              assert upgrade_walk(after) == after
              print('Geometry-only walk applies to pinned Dagor and is idempotent.')
              from tools.ke_ri_scene_lifetime import install_scene_lifetime
              scene = root / 'prog/tools/sceneTools/daEditorX/binSceneView/strmLevel.cpp'
              assert install_scene_lifetime(scene)
              once = scene.read_bytes()
              assert not install_scene_lifetime(scene)
              assert once == scene.read_bytes()
              print('RI scene lifetime drain applies to pinned Dagor and is idempotent.')
          PY
