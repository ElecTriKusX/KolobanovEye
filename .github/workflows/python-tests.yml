name: Python unit tests
on:
  push:
    branches: [feature/avg-map-catalog-whitelist]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python source syntax
        run: python -m compileall -q .
      - name: Run all tests
        run: python -m unittest discover -v
